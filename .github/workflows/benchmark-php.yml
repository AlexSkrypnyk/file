name: Benchmark PHP

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - 'feature/**'

jobs:
  benchmark-php:
    runs-on: ubuntu-latest

    steps:
      # Both revisions are checked out as siblings so their paths have the
      # same depth. Subjects that resolve against the working directory
      # measure the path they run from, so unequal paths would show up as a
      # difference between the revisions.
      - name: Checkout head revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: head
          fetch-depth: 2

      # A pull request is checked out as its merge commit and a push to main
      # as the new tip, so the first parent is the revision to compare with in
      # both cases.
      - name: Resolve base revision
        id: base
        run: echo "sha=$(git -C head rev-parse HEAD^)" >> "$GITHUB_OUTPUT"

      - name: Checkout base revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.base.outputs.sha }}
          path: base

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/composer
          key: ${{ runner.os }}-composer-${{ hashFiles('head/composer.json') }}

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: 8.3
          coverage: none

      - name: Install dependencies
        run: composer install --working-dir=head

      # One toolchain measures both revisions, so the comparison reflects the
      # change to 'src' rather than a difference between two dependency trees.
      - name: Reuse the head toolchain for the base revision
        run: cp -R head/vendor base/vendor

      - name: Compare benchmarks against the base revision
        id: perf-test
        run: |
          # PHPBench creates the directory for a rendered report but not for the
          # dumped result, which it skips with a warning and a zero exit code.
          mkdir -p head/.logs
          head/.github/scripts/benchmark-compare.sh --base=base --head=head -- --output html --output csv --dump-file .logs/performance-report.json
        continue-on-error: true

      - name: Upload performance report as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{github.job}}-performance-report
          path: |
            head/.logs/performance-report.csv
            head/.logs/performance-report.json
            head/.logs/performance-report.html
          if-no-files-found: error

      - name: Format performance results for PR comment
        if: github.event_name == 'pull_request'
        run: |
          echo "## 🚀 Performance Test Results" >> pr_comment.md
          echo "" >> pr_comment.md

          if [ "${{ steps.perf-test.outcome }}" == "success" ]; then
            echo "✅ Performance is within acceptable limits (±15% threshold)" >> pr_comment.md
          else
            echo "⚠️ **Performance regression detected!** One or more benchmarks exceeded the ±15% threshold." >> pr_comment.md
          fi

          echo "" >> pr_comment.md
          echo "_Compared against \`${{ steps.base.outputs.sha }}\`, measured back to back on the same runner._" >> pr_comment.md
          echo "" >> pr_comment.md
          echo "<details>" >> pr_comment.md
          echo "<summary>Click to see Performance Comparison Table</summary>" >> pr_comment.md
          echo "" >> pr_comment.md
          echo "_Percentages show change compared to the base revision_" >> pr_comment.md
          echo "" >> pr_comment.md

          # Extract table and remove leading whitespace
          sed -n '/<table/,/<\/table>/p' head/.logs/performance-report.html | sed 's/^[[:space:]]*//' >> pr_comment.md

          echo "" >> pr_comment.md
          echo "</details>" >> pr_comment.md

      - name: Comment PR with performance results
        if: github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body-path: pr_comment.md

      - name: Find performance benchmarks issue
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        id: find-issue
        run: |
          ISSUE_NUMBER=$(gh issue list --state open --search "Performance benchmarks" --json number --jq '.[0].number')
          echo "issue-number=$ISSUE_NUMBER" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Format performance results for issue comment
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          echo "## 📊 Performance Benchmark Results" > issue_comment.md
          echo "" >> issue_comment.md
          echo "**Commit:** [\`${{ github.sha }}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})" >> issue_comment.md
          echo "**Compared with:** \`${{ steps.base.outputs.sha }}\`" >> issue_comment.md
          echo "**Date:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> issue_comment.md
          echo "<div>" >> issue_comment.md
          sed -n '/<table/,/<\/table>/p' head/.logs/performance-report.html >> issue_comment.md
          echo "</div>" >> issue_comment.md

      - name: Post performance results to issue
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && steps.find-issue.outputs.issue-number != ''
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5
        with:
          issue-number: ${{ steps.find-issue.outputs.issue-number }}
          body-path: issue_comment.md
          edit-mode: replace

      - name: Check performance test result
        if: steps.perf-test.outcome == 'failure'
        run: |
          echo "## ⚠️ Performance Regression Detected" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "One or more benchmarks exceeded the ±15% threshold compared to \`${{ steps.base.outputs.sha }}\`." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "See the full performance report in the artifacts or PR comment for details." >> $GITHUB_STEP_SUMMARY
          exit 1
